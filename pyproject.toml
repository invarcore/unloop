[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unloop"
version = "0.1.0"
description = "The Time-Travel Debugger for AI Agents - Break out of critique loops, rewind cognitive turns, and mutate state in-flight"
readme = "README.md"
authors = [
    { name = "Vinay Kumar Ksheera Sagar", email = "sagarv.kumar48@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "textual>=0.70.0",
]

[project.urls]
Homepage = "https://invarcore.com"
Documentation = "https://invarcore.com"
Repository = "https://github.com/invarcore/unloop"
"Bug Tracker" = "https://github.com/invarcore/unloop/issues"
"Technical Whitepapers" = "https://invarcore.com/#whitepapers"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
unloop = "unloop.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/unloop"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=unloop --cov-report=term-missing --cov-fail-under=90"
