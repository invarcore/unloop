services:
  test-suite:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: unloop-test-suite
    environment:
      - PYTHONUNBUFFERED=1
    command: ["uv", "run", "pytest", "--cov=unloop", "--cov-report=term-missing", "--cov-fail-under=90"]

  smoke-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: unloop-smoke-test
    depends_on:
      - test-suite
    environment:
      - PYTHONUNBUFFERED=1
    command: ["uv", "run", "python", "benchmarks/live_debugger_smoke_test.py"]
