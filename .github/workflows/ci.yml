name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run pytest test suite with coverage enforcement (>=90%)
        run: uv run pytest -v --cov=unloop --cov-report=term-missing --cov-fail-under=90

      - name: Run live functional smoke test
        run: uv run python benchmarks/live_debugger_smoke_test.py

  docker-smoke-test:
    name: Hermetic Docker Compose Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hermetic Docker Compose Test
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from smoke-test
